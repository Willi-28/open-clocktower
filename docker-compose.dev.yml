services:
  backend:
    build:
      context: .
      target: backend
    # --reload-dir scopes the watcher to the backend source so writes under
    # /app/data (uploads, runtime state) cannot trigger reload loops.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/apps/backend --proxy-headers --forwarded-allow-ips 127.0.0.1
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./data:/app/data
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app/apps/frontend
    # npm install (not ci) so restarts reuse the warm node_modules volume
    # instead of wiping and reinstalling every time, while still picking up new
    # dependencies from package.json.
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_BACKEND_ORIGIN: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - frontend_node_modules:/app/apps/frontend/node_modules
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: open_clocktower
      POSTGRES_USER: open_clocktower
      POSTGRES_PASSWORD: open_clocktower
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_clocktower -d open_clocktower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  frontend_node_modules:
