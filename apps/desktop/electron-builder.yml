appId: com.openclocktower.desktop
productName: OpenClocktower
directories:
  output: release

afterPack: scripts/after-pack.cjs

# steamworks.js ships prebuilt native (napi) binaries plus the Steam
# redistributable — never let electron-builder try to rebuild them.
npmRebuild: false

# Keep electron-builder's default file set (app source + production node_modules,
# dev deps stripped automatically) but exclude the Python build tree (the server
# exe is added via extraResources instead) and desktop-only dev files.
files:
  - "**/*"
  - "!build/**"
  - "!test/**"
  - "!scripts/**"
  - "!server.spec"
  - "!server_entry.py"
  - "!README.md"

asar: true
# The native .node addon and the Steam runtime libs it links against cannot be
# loaded from inside the asar, so unpack the whole module to the real filesystem.
asarUnpack:
  - "**/node_modules/steamworks.js/**"

# Join-only client: it hosts nothing, so it bundles ONLY the built frontend (the
# gateway serves it as the local setup screen). Hosting is self-hosted (Docker) —
# no embedded server exe, so this build does not need the PyInstaller step.
extraResources:
  - from: ../frontend/dist
    to: frontend

# steam_appid.txt must sit next to the exe so App 480 (Spacewar) works in testing.
# For a real Steam release you ship through Steam and can drop this.
extraFiles:
  - from: steam_appid.txt
    to: steam_appid.txt

# One self-contained portable file: OpenClocktower.exe. No installer and no
# embedded backend server; the desktop client connects to a self-hosted server.
win:
  icon: assets/icon.ico
  target: portable
  artifactName: OpenClocktower-${version}.${ext}
portable:
  artifactName: OpenClocktower-${version}.${ext}
  # Extract to a fresh temp dir per launch; game data still persists in %APPDATA%.
  requestExecutionLevel: user
