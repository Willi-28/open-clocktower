[project]
name = "open-clocktower-backend"
version = "0.1.0"
description = "Backend for Open Clocktower"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "sqlalchemy",
  "psycopg[binary]",
  "python-multipart"
]

[tool.setuptools.packages.find]
where = ["."]
