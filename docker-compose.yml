services:
  app:
    build: .
    # Local first-run setup: open http://localhost:3000 after the image is built.
    ports:
      - "3000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.example
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    # Development credentials only. Production reads secrets from .env.
    environment:
      POSTGRES_DB: open_clocktower
      POSTGRES_USER: open_clocktower
      POSTGRES_PASSWORD: open_clocktower
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_clocktower -d open_clocktower"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
